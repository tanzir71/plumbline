name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/guide/**"
      - "skills/plumbline/lenses/**"
      - "CHANGELOG.md"
      - "pnpm-lock.yaml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LOCKFILE: pnpm-lock.yaml
    steps:
      - uses: actions/checkout@v7
      # withastro/action caches from a lockfile inside `path`, and this workspace keeps it at the root.
      - run: cp pnpm-lock.yaml site/pnpm-lock.yaml
      - uses: withastro/action@v6
        with:
          path: site
          package-manager: pnpm@10.33.2

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
