name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Check the tag matches every package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          for p in core cli action; do
            v="$(node -p "require('./packages/$p/package.json').version")"
            if [ "v$v" != "$TAG" ]; then echo "::error::packages/$p is $v but the tag is $TAG"; exit 1; fi
          done

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "./packages/**" build
      - run: pnpm --filter "./packages/**" test
      - run: node scripts/check-repo.mjs
      - run: node scripts/check-pricing.mjs

      - name: Publish to npm with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        # A version already on npm is skipped, so a release published by hand can still be tagged.
        run: |
          for p in core cli action; do
            name="$(node -p "require('./packages/$p/package.json').name")"
            version="$(node -p "require('./packages/$p/package.json').version")"
            if npm view "$name@$version" version > /dev/null 2>&1; then
              echo "$name@$version is already published"
            else
              pnpm --filter "$name" publish --access public --no-git-checks
            fi
          done

      - name: Move the major tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          major="${TAG%%.*}"
          git tag -f "$major" "$GITHUB_SHA"
          git push -f origin "refs/tags/$major"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" '$0 ~ "^## \\[?" v {f=1; next} /^## /{f=0} f' CHANGELOG.md > notes.md
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --title "Plumbline $TAG" --notes-file notes.md --verify-tag
