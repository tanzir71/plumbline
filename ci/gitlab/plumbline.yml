# Plumbline GitLab CI template.
#
#   include:
#     - remote: 'https://raw.githubusercontent.com/tanzir71/plumbline/v1/ci/gitlab/plumbline.yml'
#
# CI/CD variables (mask them, and protect them if you only review protected branches):
#   PLUMBLINE_MODEL_KEY      your model provider key
#   PLUMBLINE_GITLAB_TOKEN   project access token with the `api` scope
#
# Optional variables:
#   PLUMBLINE_MODEL, PLUMBLINE_PROVIDER (anthropic | bedrock | vertex | openai-compatible),
#   PLUMBLINE_BASE_URL, PLUMBLINE_COMMENT, PLUMBLINE_GATE, PLUMBLINE_LANES,
#   PLUMBLINE_FAIL_ON_ERROR, PLUMBLINE_PROOF_TESTS
#
# Plumbline can fail this job and add a label. It never approves or merges a merge request.

plumbline:
  stage: test
  image: node:22-bookworm-slim
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    GIT_DEPTH: "0"
    GIT_STRATEGY: clone
  before_script:
    - command -v git >/dev/null || (apt-get update -qq && apt-get install -y -qq git ca-certificates >/dev/null)
  script:
    # Run npx from outside the checkout, so an MR's node_modules or .npmrc cannot replace the runtime.
    - export PLUMBLINE_WORKSPACE="$CI_PROJECT_DIR"
    - cd "$(mktemp -d)"
    - npx --yes @tanziro/plumbline-action@1
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - .plumbline/run/
    reports:
      codequality: gl-code-quality-report.json
      dotenv: plumbline.env
